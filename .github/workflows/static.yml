# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

# The site's default branch is master (2026-11-11 fix: the trigger named "main",
# which does not exist, so this workflow never ran). It deploys only when
# Settings > Pages > Source is "GitHub Actions"; with "Deploy from a branch" the
# built-in "pages build and deployment" run publishes the site instead.
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
